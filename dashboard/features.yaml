      - { id: e1-daemon-set, title: "Daemon SET <n> WEIGHT / SET <n> VALUE", status: done, evidence: "dagdb/Sources/DagDBDaemonKit/DSLParser.swift (WEIGHT/VALUE cases); log-first, bounds-checked, finite-only" }

